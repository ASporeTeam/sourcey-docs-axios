skill: sourcey-build
version: "1.0.0"

catalog:
  owner: spore
  kind: skill
  audience: public
  visibility: public
  role: canonical
  execution: execute
  completion: runtime_receipt
  approval: none
  category: code

tools:
  - command.execute
  - receipt.attest

runners:
  build:
    default: true
    result_from: [attest]
    steps:
      - id: build
        label: regenerate the docs from the pinned tree and build the static site
        tool: command.execute
        scopes:
          - process.exec
        inputs:
          command: /srv/shared/gc/notes/agent4-sourcey-docs/node22/bin/node
          args:
            - /srv/shared/gc/notes/agent4-sourcey-docs/site/node_modules/sourcey/dist/cli.js
            - build
            - -o
            - dist
          cwd: site
          output_mode: text
          timeout_ms: 900000
      - id: verify
        label: fetch the published site from outside
        tool: command.execute
        scopes:
          - process.exec
        inputs:
          command: curl
          args:
            - "-4"
            - -s
            - -o
            - /dev/null
            - -w
            - "%{http_code} %{size_download} %{url_effective}"
            - https://asporeteam.github.io/sourcey-docs-axios/docs/
          cwd: .
          output_mode: text
          timeout_ms: 120000
      - id: attest
        label: bind the build and the published site into the receipt
        tool: receipt.attest
        inputs:
          action: >-
            Built the Sourcey-generated axios API reference from the pinned upstream
            tree (axios/axios v1.21.0 at commit e6b79d9cef796ca3a903bb83e51d4752b019fd67)
            and published it to GitHub Pages at
            https://asporeteam.github.io/sourcey-docs-axios/docs/
          claim: >-
            The site served at https://asporeteam.github.io/sourcey-docs-axios/docs/ is
            the static output of the Sourcey v3.8.3 build run in this receipt, generated
            from the pinned axios commit, and it answers 200 from outside.
          principal: agent-4
          evidence:
            - ref: "runx:step:build:command_execution"
              digest: $steps.build.command_execution.stdout_digest
              proves: >-
                Sourcey v3.8.3 ran in this receipt and built the site from the pinned
                tree: exit code 0, 17 pages, output under site/dist.
            - ref: "runx:step:verify:command_execution"
              digest: $steps.verify.command_execution.stdout_digest
              proves: >-
                The published URL https://asporeteam.github.io/sourcey-docs-axios/docs/
                answered HTTP 200 with 24993 bytes when fetched from outside this sandbox.
            - ref: "https://github.com/axios/axios@e6b79d9cef796ca3a903bb83e51d4752b019fd67"
              digest: sha256:9b54e731d4d064192a99539a0165f6c5cd4da4a9d52e0f8a4a8b269bca7140c3
              proves: >-
                The upstream pin the reference was generated from: axios/axios v1.21.0,
                MIT license, commit e6b79d9cef796ca3a903bb83e51d4752b019fd67.
          scope:
            downstream_use: venue evidence for a documentation bounty
            bounds: documents this build only

harness:
  cases:
    - name: sourcey-build-standalone-rebuild
      operator_journeys:
        - mode: standalone
          confusors: [research, issue-to-pr]
          request: Rebuild the Sourcey docs site for the pinned axios tree and seal the result.
          expected_outcome: Rebuild the site from the pinned tree, fetch the published URL from outside, and seal both facts into one receipt.
      runner: build
      expect:
        status: sealed
    - name: sourcey-build-composed-reuse
      operator_journeys:
        - mode: composed
          request: Rebuild it again now that the site is published.
          expected_outcome: Reuse the prior sealed receipt's evidence and rebuild only what changed, without repeating the settled upstream pin.
          prior_evidence:
            - The previous turn's sealed receipt, which already names the pinned upstream commit and the published URL.
          must_not_repeat:
            - Do not re-pick or re-clone the upstream commit; it is already bound in the prior receipt.
      runner: build
      expect:
        status: sealed
